<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>VR-CAD Test 03</title><style>html,body{margin:0;background:#080b10;color:white;font:15px system-ui;height:100%;overflow:hidden}#eyes{display:flex;width:100vw;height:100dvh} .eye{width:50%;height:100%;overflow:hidden;position:relative;border-right:1px solid #444;box-sizing:border-box}.eye video{width:100%;height:100%;object-fit:cover}.mark{position:absolute;top:50%;left:50%;width:22px;height:22px;transform:translate(-50%,-50%);border:1px solid #55edb4;border-radius:50%;pointer-events:none}#controls{position:fixed;z-index:10;top:8px;left:50%;transform:translateX(-50%);background:#151b25e8;padding:10px;border-radius:12px;text-align:center;max-width:90vw}button{font:inherit;padding:10px 14px;border:0;border-radius:8px;background:#60dfac;color:#001b12;font-weight:700}#status{font-size:12px;margin-top:6px} .hide #controls{display:none}#show{display:none;position:fixed;top:5px;right:5px;z-index:20;background:#fff9;padding:5px;font-size:11px}.hide #show{display:block}</style></head><body><div id="eyes"><div class="eye"><video id="left" autoplay muted playsinline></video><div class="mark"></div></div><div class="eye"><video id="right" autoplay muted playsinline></video><div class="mark"></div></div></div><div id="controls"><button id="start">Uruchom tylną kamerę</button> <button id="full">Pełny ekran</button> <button id="hide">Ukryj panel</button><div id="status">Wymaga HTTPS lub localhost. Użyj Chrome.</div></div><button id="show">Panel</button><script>const left=document.getElementById('left'),right=document.getElementById('right'),status=document.getElementById('status');document.getElementById('start').onclick=async()=>{try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Kamera wymaga bezpiecznego adresu HTTPS lub localhost');let stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}});left.srcObject=stream;right.srcObject=stream;await Promise.all([left.play(),right.play()]);const track=stream.getVideoTracks()[0];status.textContent='Kamera działa: '+(track.getSettings().facingMode||track.label||'sprawdź obraz');}catch(e){status.textContent='Błąd: '+e.message;}};document.getElementById('full').onclick=async()=>{try{await document.documentElement.requestFullscreen();if(screen.orientation?.lock)await screen.orientation.lock('landscape').catch(()=>{});}catch(e){status.textContent='Pełny ekran niedostępny: '+e.message;}};document.getElementById('hide').onclick=()=>document.body.classList.add('hide');document.getElementById('show').onclick=()=>document.body.classList.remove('hide');</script></body></html>
